kind = "web"
previewPath = "/"
title = "競技かるた暗記練習"
version = "1.0.0"
id = "artifacts/karuta-practice"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20180

[services.development]
run = "pnpm --filter @workspace/karuta-practice run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/karuta-practice", "run", "build" ]
publicDir = "artifacts/karuta-practice/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20180"
BASE_PATH = "/"
